services:
  postgres:
    image: postgres:15-alpine
    container_name: kitap-test-db
    environment:
      POSTGRES_USER: kitapapp
      POSTGRES_PASSWORD: kitapapp123
      POSTGRES_DB: kitap_test_db_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kitap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitapapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: yasinkartal/kitap-backend:latest
    container_name: kitap-test-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kitap_test_db_v2
      DB_USER: kitapapp
      DB_PASSWORD: kitapapp123
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kitap-network
    restart: unless-stopped

  frontend:
    image: yasinkartal/kitap-frontend:latest
    container_name: kitap-test-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - kitap-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  kitap-network:
    driver: bridge
