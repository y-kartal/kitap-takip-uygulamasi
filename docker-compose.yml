services:
  postgres:
    image: postgres:15-alpine
    container_name: kitap-test-db
    environment:
      POSTGRES_USER: kitapapp
      POSTGRES_PASSWORD: kitapapp123
      POSTGRES_DB: kitap_test_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kitap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitapapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kitap-test-backend
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads
      - ./backend/src:/app/src
    ports:
      - "5000:5000"
      - "0.0.0.0:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kitap-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: kitap-test-frontend
    environment:
      REACT_APP_API_URL: /api
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      - backend
    networks:
      - kitap-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  kitap-network:
    driver: bridge
