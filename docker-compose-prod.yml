services:
  postgres:
    image: postgres:15-alpine
    container_name: kitap-test-db-prod
    environment:
      POSTGRES_USER: kitapapp
      POSTGRES_PASSWORD: kitapapp123
      POSTGRES_DB: kitap_test_db_v2
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - kitap-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitapapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ykartal/kitap-backend:latest
    container_name: kitap-test-backend-prod
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://kitapapp:kitapapp123@postgres:5432/kitap_test_db_v2
    volumes:
      - uploads_prod:/app/uploads
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kitap-network-prod
    restart: unless-stopped

  frontend:
    image: ykartal/kitap-frontend:latest
    container_name: kitap-test-frontend-prod
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - kitap-network-prod
    restart: unless-stopped

volumes:
  postgres_data_prod:
    driver: local
  uploads_prod:
    driver: local

networks:
  kitap-network-prod:
    driver: bridge
