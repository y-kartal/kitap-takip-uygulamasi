services:
  postgres:
    image: postgres:15-alpine
    container_name: kitap-test-db-v2
    environment:
      POSTGRES_USER: kitapapp
      POSTGRES_PASSWORD: kitapapp123
      POSTGRES_DB: kitap_test_db_v2
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - kitap-network-v2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitapapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kitap-backend:v2
    container_name: kitap-test-backend-v2
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kitap_test_db_v2
      DB_USER: kitapapp
      DB_PASSWORD: kitapapp123
      PORT: 5000
    volumes:
      - uploads_v2:/app/uploads
      - ./backend/src:/app/src
    ports:
      - "5001:5000"
      - "0.0.0.0:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kitap-network-v2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    image: kitap-frontend:v2
    container_name: kitap-test-frontend-v2
    environment:
      REACT_APP_API_URL: /api
    ports:
      - "0.0.0.0:3001:80"
    depends_on:
      - backend
    networks:
      - kitap-network-v2
    restart: unless-stopped

volumes:
  postgres_data_v2:
    driver: local
  uploads_v2:
    driver: local

networks:
  kitap-network-v2:
    driver: bridge
